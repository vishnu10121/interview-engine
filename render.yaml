services:
  - type: web
    name: ai-interview-engine-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PYTHONPATH
        value: .
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: 467625625228-vs1j0u5plelrhnb59qrktmnvu6t7tlub.apps.googleusercontent.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://ai-interview-engine-frontend.onrender.com,http://localhost:3000

  - type: static
    name: ai-interview-engine-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    envVars:
      - key: CI
        value: false
      - key: REACT_APP_API_BASE_URL
        value: https://interview-engine-backend1.onrender.com
      - key: REACT_APP_GOOGLE_CLIENT_ID
        value: 467625625228-vs1j0u5plelrhnb59qrktmnvu6t7tlub.apps.googleusercontent.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

